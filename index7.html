<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yigitqwc | Koray Bird</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-red: #ff0000;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: none;
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            overflow-x: hidden; width: 100vw; min-height: 100vh; display: flex; flex-direction: column;
        }

        /* ÖZEL İMLEÇ */
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 16px; height: 16px;
            background-color: transparent; border: 2px solid var(--accent-red);
            pointer-events: none; z-index: 9999999;
            transform: translate(-50%, -50%) rotate(45deg);
            box-shadow: 0 0 10px var(--accent-red), inset 0 0 5px var(--accent-red);
            transition: width 0.2s, height 0.2s;
        }
        .custom-cursor::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: var(--accent-red); transform: translate(-50%, -50%);
        }
        .cursor-hover { width: 28px; height: 28px; background-color: rgba(255, 0, 0, 0.25); }

        /* KAN DAMLASI EFEKTİ */
        .click-ripple {
            position: fixed; border-radius: 50%; border: 2px solid var(--accent-red);
            pointer-events: none; transform: translate(-50%, -50%);
            animation: rippleEffect 0.6s ease-out forwards; z-index: 99998;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
        }

        /* SHARINGAN YÜKLEME EKRANI VE KORAY BİRD İNTRO */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 99999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .sharingan {
            width: 80px; height: 80px; margin-bottom: 25px;
            animation: spin 2.5s linear infinite; filter: drop-shadow(0 0 15px rgba(255,0,0,0.8));
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #400000; z-index: 99998; display: flex;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
        }
        .intro-text {
            font-size: 5rem; font-weight: 900; color: #ffffff; letter-spacing: 12px;
            text-transform: uppercase; text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
            opacity: 0; transform: scale(0.8);
            transition: opacity 1s ease, transform 1s ease;
        }

        /* LOGO VE LAZER ÇİZGİSİ */
        .logo-container {
            position: relative; text-decoration: none; color: var(--text-color);
            display: inline-block; padding-bottom: 4px;
        }
        .logo-text {
            font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;
            display: inline-block; animation: glitch-anim 6s infinite;
        }
        @keyframes glitch-anim {
            0%, 93%, 100% { text-shadow: 0 0 15px rgba(255,0,0,0.8); transform: translate(0); }
            94% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, -2px); }
            96% { text-shadow: -3px 0 0 red, 3px 0 0 white; transform: translate(-3px, 2px); }
            98% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, 2px); }
        }
        .red-line-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: rgba(255, 0, 0, 0.2); border-radius: 2px; overflow: hidden;
        }
        .red-line-wrapper::after {
            content: ''; position: absolute; top: 0; left: -50%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, #ff0000, #ffffff, #ff0000, transparent);
            box-shadow: 0 0 8px #ff0000; animation: beamMove 2.5s infinite linear;
        }
        @keyframes beamMove { 0% { left: -50%; } 100% { left: 100%; } }

        /* ARKA PLAN VE KARARTMA */
        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-image: url('bg.jpg'); background-size: cover; background-position: center;
            filter: brightness(0.25); z-index: -2; pointer-events: none;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,0.95) 100%);
            pointer-events: none; z-index: -1;
        }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        /* ÜST NAVİGASYON */
        nav {
            background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 3rem; position: relative; z-index: 10;
            border-bottom: 1px solid rgba(255, 0, 0, 0.15);
        }
        .back-link {
            color: #aaa; text-decoration: none; font-size: 1rem; font-weight: 600;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--accent-red); }

        /* İÇERİK KAPSAYICISI */
        .content-container {
            position: relative; z-index: 5; width: 90%; max-width: 1000px; margin: 40px auto;
            display: flex; flex-direction: column; gap: 50px; padding-bottom: 60px;
        }

        .section-card {
            background: rgba(15, 2, 2, 0.85); border: 2px solid rgba(255, 0, 0, 0.4);
            border-radius: 20px; padding: 40px; box-shadow: 0 0 35px rgba(255, 0, 0, 0.25);
            backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center;
            text-align: center; transition: border-color 0.3s, transform 0.3s;
        }
        .section-card:hover { border-color: var(--accent-red); transform: translateY(-3px); }

        .profile-img {
            width: 320px; height: 400px; object-fit: cover; border-radius: 14px;
            border: 4px solid #ffffff; box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            margin-bottom: 30px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }
        .profile-img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .section-title {
            font-size: 2.3rem; font-weight: 900; color: #ff3333; margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255,0,0,0.5); letter-spacing: 1px;
        }

        .section-text {
            font-size: 1.1rem; line-height: 1.8; color: #ddd; text-align: justify;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>

    <!-- 1. SHARINGAN YÜKLEME EKRANI -->
    <div id="splash">
        <svg class="sharingan" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#990000" stroke="#111" stroke-width="4"/>
            <circle cx="50" cy="50" r="24" fill="none" stroke="#111" stroke-width="2" opacity="0.6"/>
            <circle cx="50" cy="50" r="8" fill="#000"/>
            <g>
                <g transform="translate(50, 26)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
                <g transform="translate(71, 62) rotate(120)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
                <g transform="translate(29, 62) rotate(240)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
            </g>
        </svg>
        <div class="logo-container">
            <div class="logo-text" style="font-size:2rem;">yigitqwc</div>
            <div class="red-line-wrapper"></div>
        </div>
    </div>

    <!-- 2. KOYU KIRMIZI INTRO EKRANI -->
    <div id="intro-overlay">
        <div class="intro-text" id="introText">KORAY BİRD</div>
    </div>

    <!-- ARKA PLAN VE KÜLLER -->
    <div class="hero-bg"></div>
    <div class="vignette"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- ÜST NAVİGASYON -->
    <nav>
        <a href="index.html" class="logo-container hover-target">
            <div class="logo-text">yigitqwc</div>
            <div class="red-line-wrapper"></div>
        </a>
        <a href="index.html" class="back-link hover-target">← Ana Sayfa</a>
    </nav>

    <!-- İÇERİK KAPSAYICISI (YENİ EKLENEN MEANDKORAY EN ÜSTTE) -->
    <div class="content-container">

        <!-- YENİ EKLENEN GÖRSEL (meandkoray.jpeg) -->
        <section class="section-card">
            <img src="meandkoray.jpeg" alt="Yigit ve Koray" class="profile-img hover-target">
            <h2 class="section-title">Koray Bird - Özel Anlar</h2>
            <p class="section-text">...</p>
        </section>

        <!-- 1. BÖLÜM (saskınK.jpeg) -->
        <section class="section-card">
            <img src="saskınK.jpeg" alt="Koray Bird" class="profile-img hover-target">[cite: 6]
            <h2 class="section-title">Koray Bird - Bölüm I</h2>
            <p class="section-text">...</p>
        </section>

        <!-- 2. BÖLÜM (obezK.jpeg) -->
        <section class="section-card">
            <img src="obezK.jpeg" alt="Koray Bird" class="profile-img hover-target">[cite: 7]
            <h2 class="section-title">Koray Bird - Bölüm II</h2>
            <p class="section-text">...</p>
        </section>

        <!-- 3. BÖLÜM (chud2K.jpeg) -->
        <section class="section-card">
            <img src="chud2K.jpeg" alt="Koray Bird" class="profile-img hover-target">[cite: 8]
            <h2 class="section-title">Koray Bird - Bölüm III</h2>
            <p class="section-text">...</p>
        </section>

        <!-- 4. BÖLÜM (chudK.jpg) -->
        <section class="section-card">
            <img src="chudK.jpeg" alt="Koray Bird" class="profile-img hover-target">[cite: 9]
            <h2 class="section-title">Koray Bird - Bölüm IV</h2>
            <p class="section-text">...</p>
        </section>

    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                    
                    const intro = document.getElementById('intro-overlay');
                    const text = document.getElementById('introText');
                    intro.style.opacity = '1';
                    
                    setTimeout(() => {
                        text.style.opacity = '1';
                        text.style.transform = 'scale(1)';
                    }, 100);

                    setTimeout(() => {
                        text.style.opacity = '0';
                        text.style.transform = 'scale(1.2)';
                    }, 2000);

                    setTimeout(() => {
                        intro.style.opacity = '0';
                        setTimeout(() => { intro.style.display = 'none'; }, 1500);
                    }, 3000);

                }, 800);
            }, 1500);
        });

        const cursor = document.getElementById('cursor');
        const hoverTargets = document.querySelectorAll('.hover-target');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        hoverTargets.forEach(target => {
            target.addEventListener('mouseenter', () => cursor.classList.add('cursor-hover'));
            target.addEventListener('mouseleave', () => cursor.classList.remove('cursor-hover'));
        });

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 200;
                this.size = Math.random() * 2.5 + 1;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() * 1) - 0.5;
                this.opacity = Math.random() * 0.6 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < 0) { this.y = canvas.height + 100; this.x = Math.random() * canvas.width; }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 0, 0, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particlesArray.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
