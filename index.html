<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yigitqwc | Ana Sayfa</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #030101;
            --text-color: #ffffff;
            --accent-red: #ff1111;
            --accent-gold: #ffcc00;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: none; 
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }

        /* TIKLAMA VE İMLEÇ EFEKTLERİ */
        .click-ripple {
            position: fixed; border-radius: 50%; border: 2px solid var(--accent-red);
            pointer-events: none; transform: translate(-50%, -50%);
            animation: rippleEffect 0.6s ease-out forwards; z-index: 99998;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
        }

        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 16px; height: 16px;
            background-color: transparent; border: 2px solid var(--accent-red);
            pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%) rotate(45deg);
            transition: width 0.2s, height 0.2s;
            box-shadow: 0 0 10px var(--accent-red), inset 0 0 5px var(--accent-red);
        }
        .custom-cursor::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: var(--accent-red); transform: translate(-50%, -50%);
        }
        .cursor-hover { width: 32px; height: 32px; background-color: rgba(255, 0, 0, 0.2); }

        /* AÇILIŞ (SPLASH) EKRANI */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100000;
            transition: opacity 1s ease, visibility 1s ease;
        }
        .sharingan {
            width: 90px; height: 90px; margin-bottom: 25px;
            animation: spin 2.5s linear infinite; filter: drop-shadow(0 0 20px rgba(255,0,0,0.9));
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* LOGO EFEKTLERİ */
        .logo-container {
            position: relative; text-decoration: none; color: var(--text-color);
            display: inline-block; padding-bottom: 4px;
        }
        .logo-text {
            font-size: 2.4rem;
            font-weight: 900; letter-spacing: -0.5px;
            display: inline-block; animation: glitch-anim 6s infinite;
        }
        @keyframes glitch-anim {
            0%, 93%, 100% { text-shadow: 0 0 15px rgba(255,0,0,0.8); transform: translate(0); }
            94% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, -2px); }
            96% { text-shadow: -3px 0 0 red, 3px 0 0 white; transform: translate(-3px, 2px); }
            98% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, 2px); }
        }
        .red-line-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: rgba(255, 0, 0, 0.2); border-radius: 2px; overflow: hidden;
        }
        .red-line-wrapper::after {
            content: ''; position: absolute; top: 0; left: -50%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, #ff0000, #ffffff, #ff0000, transparent);
            box-shadow: 0 0 8px #ff0000; animation: beamMove 2.5s infinite linear;
        }
        @keyframes beamMove { 0% { left: -50%; } 100% { left: 100%; } }

        /* ARKA PLAN VE PARÇACIKLAR */
        .hero-bg {
            position: absolute; top: -2%; left: -2%; width: 104%; height: 104%; 
            background-image: url('bg.jpg'); background-size: cover; background-position: center;
            z-index: 1; 
        }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none; z-index: 2;
        }
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        /* ÜST MENÜ DÜZENİ */
        nav {
            background-color: rgba(5, 0, 0, 0.6); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.5rem 3rem; position: relative; z-index: 10;
            border-bottom: 1px solid rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .nav-left-group { display: flex; align-items: center; gap: 3rem; }
        .nav-links { display: flex; align-items: center; gap: 2.5rem; }
        
        .nav-link {
            color: #ddd; text-decoration: none; font-size: 1.2rem;
            font-weight: 700; letter-spacing: 1px; text-transform: lowercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; line-height: 1; margin: 0;
        }
        .nav-link:hover {
            color: var(--accent-red);
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 30px rgba(255, 0, 0, 0.5);
            transform: translateY(-3px) scale(1.1);
        }

        .nav-link.mka-link {
            font-size: 1.5rem; font-weight: 900; color: #ffffff;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
        }
        .nav-link.mka-link:hover {
            color: #ffffff; 
            text-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff, 0 0 60px #ffffff; 
            transform: translateY(-3px) scale(1.15);
        }

        .socials { display: flex; gap: 2rem; align-items: center; }
        .social-link {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            color: var(--text-color); gap: 6px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .social-link svg { width: 28px; height: 28px; fill: #ccc; transition: all 0.3s ease; }
        .social-link span { font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: #aaa; transition: 0.3s; }
        
        .social-link:hover { transform: scale(1.2) translateY(-4px); }
        .social-link:hover svg { 
            fill: var(--accent-red); 
            filter: drop-shadow(0 0 15px var(--accent-red)) drop-shadow(0 0 25px var(--accent-red)); 
        }
        .social-link:hover span { 
            color: var(--accent-red); 
            text-shadow: 0 0 10px var(--accent-red), 0 0 20px var(--accent-red); 
        }

        /* MÜZİK OYNATICI */
        .music-player {
            position: fixed; bottom: 30px; left: 30px; z-index: 100; display: flex; align-items: center; gap: 12px;
            background: rgba(10, 0, 0, 0.7); padding: 12px 20px; border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 30px; backdrop-filter: blur(8px); transition: 0.3s;
        }
        .music-player:hover { border-color: var(--accent-red); box-shadow: 0 0 20px rgba(255,0,0,0.5); transform: scale(1.05); }
        .music-btn { background: none; border: none; color: white; font-size: 1.5rem; outline: none; transition: 0.3s; }
        .music-btn:hover { color: var(--accent-red); text-shadow: 0 0 10px red; }
        .music-text { font-size: 0.9rem; font-weight: bold; color: #ccc; }

        /* YÖNETİCİ PANELİ (SAĞ ALT) */
        .admin-trigger {
            position: fixed; bottom: 30px; right: 30px; z-index: 100;
            background: rgba(15, 0, 0, 0.8); border: 1px solid rgba(255, 0, 0, 0.4);
            color: #aaa; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem;
            font-weight: bold; letter-spacing: 1px; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .admin-trigger:hover {
            color: #fff; border-color: var(--accent-red); background: rgba(40, 0, 0, 0.9);
            box-shadow: 0 0 15px rgba(255,0,0,0.6); transform: scale(1.05);
        }

        /* TERMINAL PENCERESİ */
        #terminal-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 999999;
        }
        .terminal-box {
            width: 550px; background: rgba(10, 2, 2, 0.95); border: 2px solid var(--accent-red);
            border-radius: 12px; box-shadow: 0 0 40px rgba(255, 0, 0, 0.4); overflow: hidden;
            display: flex; flex-direction: column;
        }
        .terminal-header {
            background: #1a0000; padding: 10px 15px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #440000; font-size: 0.9rem; font-weight: bold; color: #ff4444;
        }
        .terminal-close { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }
        .terminal-close:hover { color: #fff; }
        .terminal-body {
            padding: 20px; height: 280px; overflow-y: auto; font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem; color: #00ff66; display: flex; flex-direction: column; gap: 8px;
        }
        .terminal-input-line {
            display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6);
            padding: 10px 15px; border-top: 1px solid #330000; font-family: 'Courier New', Courier, monospace;
        }
        .terminal-input-line span { color: #ff3333; font-weight: bold; }
        .terminal-input {
            background: none; border: none; outline: none; color: #fff; font-size: 1rem; flex-grow: 1;
            font-family: 'Courier New', Courier, monospace;
        }

        /* MOBİL VE TABLET UYUMU */
        @media (max-width: 1024px) {
            nav { flex-direction: column; gap: 2rem; padding: 1.5rem; text-align: center; }
            .nav-left-group { flex-direction: column; gap: 1.5rem; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
            .socials { padding-left: 0; border-left: none; border-top: 1px solid rgba(255,0,0,0.3); padding-top: 1.5rem; width: 100%; justify-content: center; flex-wrap: wrap; }
            body { overflow-y: auto; height: auto; min-height: 100vh; }
            .hero-bg { position: fixed; }
            .music-player { bottom: 15px; left: 15px; padding: 8px 15px; }
            .admin-trigger { bottom: 15px; right: 15px; padding: 8px 14px; font-size: 0.75rem; }
            .terminal-box { width: 90vw; }
        }

        @media (pointer: coarse) {
            .custom-cursor { display: none !important; }
            * { cursor: auto !important; }
        }
    </style>
</head>

    <!-- TERMINAL MODAL -->

        <div class="terminal-box">
            <div class="terminal-header">
                <span>yigitqwc@root-terminal:~</span>
                <button class="terminal-close hover-target" onclick="closeTerminal()">✕</button>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div>[SYSTEM] Güvenli terminal oturumu başlatıldı.</div>
                <div>[SYSTEM] Yetki almak için yönetici şifresini // ile başlayarak girin</div>
                <br>
            </div>
            <div class="terminal-input-line">
                <span>></span>
                <input type="text" id="terminalInput" class="terminal-input" placeholder="Şifre veya komut yazın..." autofocus autocomplete="off">

        <span class="music-text">Sesi Aç</span>
    </div>

    <script>
        let isAuthenticated = false;
        let actualInput = ""; // Gerçek şifreyi arka planda tutacağız

        function openTerminal() {
            document.getElementById('terminal-modal').style.display = 'flex';
            setTimeout(() => { document.getElementById('terminalInput').focus(); }, 100);
        }

        function closeTerminal() {
            document.getElementById('terminal-modal').style.display = 'none';
        }

        const terminalInput = document.getElementById('terminalInput');

        // Şifre girerken // ile başlıyorsa ekranı sansürle (**)
        terminalInput.addEventListener('input', function(e) {
            let val = terminalInput.value;
            
            // Eğer yeni bir şeyler yazıldıysa gerçek değeri güncelle
            if (val.length > actualInput.length) {
                let addedChar = val.substring(actualInput.length);
                actualInput += addedChar;
            } else {
                // Silme işlemi yapıldıysa
                actualInput = actualInput.substring(0, val.length);
            }

            // Eğer şifre modundaysak (// ile başlıyorsa) ekranda yıldız göster
            if (actualInput.startsWith('//') && !isAuthenticated) {
                let stars = '//' + '*'.repeat(actualInput.length - 2);
                terminalInput.value = stars;
            }
        });

        terminalInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                let val = actualInput.trim();
                let body = document.getElementById('terminalBody');

                if (val === '') return;

                // Ekrana komutun sansürlenmiş veya açık halini yaz
                let displayVal = (val.startsWith('//') && !isAuthenticated) ? '//' + '*'.repeat(val.length - 2) : val;
                body.innerHTML += `<div>> ${displayVal}</div>`;
                
                terminalInput.value = '';
                actualInput = '';

                if (!isAuthenticated) {
                    // Şifre kontrolü (//yigit123 şeklinde girilmeli)
                    if (val === '//yigitqwc123') {
                        isAuthenticated = true;
                        body.innerHTML += `<div style="color:#00ff66;">[SUCCESS] Şifre doğru. Yönetici yetkisi alındı.</div>`;
                        body.innerHTML += `<div style="color:#ffcc00;">[INFO] cekiccell</div>`;
                    } else {
                        body.innerHTML += `<div style="color:#ff3333;">[ERROR] Hatalı şifre! </div>`;
                    }
                } else {
                    if (val === '/koraybird') {
                        body.innerHTML += `<div style="color:#00ff66;">[REDIRECT] KorayBird sayfasına yönlendiriliyorsunuz...</div>`;
                        setTimeout(() => {
                            window.location.href = 'index7.html';
                        }, 1000);
                    } else if (val === 'exit') {
                        isAuthenticated = false;
                        body.innerHTML += `<div>[SYSTEM] Oturum kapatıldı. Şifre tekrar isteniyor.</div>`;
                    } else {
                        body.innerHTML += `<div style="color:#ff3333;">[ERROR] Bilinmeyen komut: ${val}</div>`;
                    }
                }
                body.scrollTop = body.scrollHeight;
            }
        });

        // Müzik Kontrolü
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.querySelector('.music-text');
        let isPlaying = false;

        musicToggle.addEventListener('click', () => {
            if (isPlaying) { bgMusic.pause(); musicIcon.innerText = '▶'; musicText.innerText = 'Sesi Aç'; }
            else { bgMusic.play(); musicIcon.innerText = '⏸'; musicText.innerText = 'Sesi Kapat'; }
            isPlaying = !isPlaying;
        });

        // Yükleme Ekranı
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').style.visibility = 'hidden', 1000);
            }, 1200);
        });

        // İmleç ve Tıklama Efektleri
        const cursor = document.getElementById('cursor');
        const hoverTargets = document.querySelectorAll('.hover-target');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        document.addEventListener('mouseover', (e) => {
            if(e.target.closest('.hover-target')) { cursor.classList.add('cursor-hover'); }
        });
        document.addEventListener('mouseout', (e) => {
            if(e.target.closest('.hover-target')) { cursor.classList.remove('cursor-hover'); }
        });

        // Parçacık Animasyonu
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        
        for (let i = 0; i < 50; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2.5 + 1, sy: Math.random() * 1.5 + 0.5 });
        }
        
        function anim() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255,0,0,0.5)";
            particles.forEach(p => {
                p.y -= p.sy; 
                if (p.y < 0) { p.y = canvas.height + 20; p.x = Math.random() * canvas.width; }
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
