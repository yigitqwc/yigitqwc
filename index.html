<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yigitqwc</title>
    <style>
        /* ================= KÖK DEĞİŞKENLER & SIFIRLAMA ================= */
        :root {
            --bg-color: #050505;
            --nav-bg: #000000;
            --text-color: #ffffff;
            --accent-red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ================= NAVİGASYON ================= */
        nav {
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            position: relative;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 0, 0, 0.1);
        }

        /* Logo ve Kırmızı Çizgi Animasyonu */
        .logo-container {
            position: relative;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
            overflow: hidden;
            padding-bottom: 5px;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .red-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 20px;
            height: 4px;
            background-color: var(--accent-red);
            transition: left 0.4s ease-out;
        }

        .logo-container:hover .red-line,
        .logo-container:focus-visible .red-line {
            animation: slideLine 2.5s linear infinite;
        }

        @keyframes slideLine {
            0% { left: -20px; }
            100% { left: 100%; }
        }

        /* Sosyal Medya Bağlantıları */
        .socials {
            display: flex;
            gap: 3rem;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            gap: 8px;
            transition: transform 0.25s ease, text-shadow 0.25s ease;
            outline: none;
        }

        .social-link svg {
            width: 32px;
            height: 32px;
            fill: var(--text-color);
            transition: fill 0.25s ease, filter 0.25s ease;
        }

        .social-link span {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .social-link:hover,
        .social-link:focus-visible {
            transform: scale(1.05);
        }

        .social-link:hover svg,
        .social-link:focus-visible svg {
            fill: var(--accent-red);
            filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.6));
        }

        .social-link:hover span,
        .social-link:focus-visible span {
            color: var(--accent-red);
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.4);
        }

        /* ================= ANA GÖRSEL (TEK PARÇA) ================= */
        .hero {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background-color: #0a0000;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* DİKKAT: Resminizin adını buraya yazın. bg.jpg olarak ayarladım. */
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Yavaş ve sinematik yakınlaşma efekti */
            transition: transform 6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Fare ana görsele geldiğinde resim hafifçe büyür */
        .hero:hover .hero-bg {
            transform: scale(1.08);
        }

        /* ================= MOBİL & RESPONSIVE ================= */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
            }
            .socials {
                position: static;
                transform: none;
                width: 100%;
                justify-content: space-around;
                gap: 1rem;
            }
            .logo-text { font-size: 1.8rem; }
        }

        /* Hareket Azaltma (Erişilebilirlik) */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .red-line { left: 0 !important; width: 100% !important; animation: none !important; }
            .hero:hover .hero-bg { transform: none; }
        }
    </style>
</head>
