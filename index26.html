<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yigitqwc | QR Kod Oluşturucu Stüdyosu</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* ORİJİNAL KLASİK UCHIHA / KIRMIZI-SİYAH RENK PALETİ */
        :root {
            --bg-color: #030101;
            --text-color: #ffffff;
            --accent-red: #ff0000;
            --accent-gold: #ffcc00;
            --accent-green: #00ff66;
            --panel-bg: rgba(12, 1, 1, 0.9);
            --border-red: rgba(255, 0, 0, 0.35);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: none;
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
        }

        /* KLASİK ÖZEL İMLEÇ VE TIKLAMA EFEKTİ */
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 16px; height: 16px;
            background-color: transparent; border: 2px solid var(--accent-red);
            pointer-events: none; z-index: 9999999;
            transform: translate(-50%, -50%) rotate(45deg);
            box-shadow: 0 0 10px var(--accent-red), inset 0 0 5px var(--accent-red);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        .custom-cursor::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: var(--accent-red); transform: translate(-50%, -50%);
        }
        .cursor-hover { width: 30px; height: 30px; background-color: rgba(255, 0, 0, 0.25); }

        .click-ripple {
            position: fixed; border-radius: 50%; border: 2px solid var(--accent-red);
            pointer-events: none; transform: translate(-50%, -50%);
            animation: rippleEffect 0.6s ease-out forwards; z-index: 99998;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
        }

        /* SHARINGAN YÜKLEME EKRANI */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100000;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        .sharingan {
            width: 85px; height: 85px; margin-bottom: 25px;
            animation: spin 2.5s linear infinite; filter: drop-shadow(0 0 20px rgba(255,0,0,0.9));
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* LOGO EFEKTLERİ */
        .logo-container {
            position: relative; text-decoration: none; color: var(--text-color);
            display: inline-block; padding-bottom: 4px;
        }
        .logo-text {
            font-size: 2rem; font-weight: 900; letter-spacing: -0.5px;
            display: inline-block; animation: glitch-anim 6s infinite;
        }
        @keyframes glitch-anim {
            0%, 93%, 100% { text-shadow: 0 0 15px rgba(255,0,0,0.8); transform: translate(0); }
            94% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, -2px); }
            96% { text-shadow: -3px 0 0 red, 3px 0 0 white; transform: translate(-3px, 2px); }
            98% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, 2px); }
        }
        .red-line-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: rgba(255, 0, 0, 0.2); border-radius: 2px; overflow: hidden;
        }
        .red-line-wrapper::after {
            content: ''; position: absolute; top: 0; left: -50%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, #ff0000, #ffffff, #ff0000, transparent);
            box-shadow: 0 0 8px #ff0000; animation: beamMove 2.5s infinite linear;
        }
        @keyframes beamMove { 0% { left: -50%; } 100% { left: 100%; } }

        /* ARKA PLAN VE KÜLLER */
        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-image: url('bg.jpg'); background-size: cover; background-position: center;
            filter: brightness(0.18) blur(2px); z-index: -2; pointer-events: none;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 20%, rgba(0,0,0,0.96) 100%);
            pointer-events: none; z-index: -1;
        }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        /* ÜST MENÜ */
        nav {
            background-color: rgba(5, 0, 0, 0.9); backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 3rem; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-red);
            box-shadow: 0 4px 25px rgba(255, 0, 0, 0.25);
        }
        .nav-left { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .module-badge {
            background: rgba(255, 0, 0, 0.15); border: 1px solid var(--accent-red);
            color: #fff; font-weight: 800; font-size: 0.82rem; padding: 5px 14px;
            border-radius: 20px; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
        }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .back-link {
            color: #ccc; text-decoration: none; font-size: 0.95rem; font-weight: 700;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .back-link:hover { color: var(--accent-red); text-shadow: 0 0 10px var(--accent-red); }

        /* ANA KONTEYNER */
        .qr-studio-wrapper {
            position: relative; z-index: 5; width: 95%; max-width: 1360px;
            margin: 30px auto 60px auto; display: flex; flex-direction: column; gap: 28px;
        }

        .studio-grid {
            display: grid; grid-template-columns: 1.25fr 0.95fr; gap: 28px; align-items: start;
        }

        /* SOL PANEL: VERİ GİRİŞİ VE TASARIM ÖZELLEŞTİRME */
        .config-panel {
            background: var(--panel-bg); border: 2px solid var(--border-red);
            border-radius: 18px; padding: 28px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            backdrop-filter: blur(14px);
            display: flex; flex-direction: column; gap: 22px;
        }

        .panel-title {
            font-size: 1.35rem; font-weight: 900; color: #fff;
            border-bottom: 1px solid #440000; padding-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-title span { color: var(--accent-red); }

        /* QR TÜRÜ SEKMELERİ (URL, METİN, WI-FI) */
        .mode-tabs {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .mode-tab-btn {
            background: rgba(25, 0, 0, 0.7); border: 1px solid #550000;
            color: #bbb; padding: 12px 10px; border-radius: 10px;
            font-weight: 800; font-size: 0.9rem; transition: all 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .mode-tab-btn.active, .mode-tab-btn:hover {
            background: rgba(255, 0, 0, 0.25); color: #fff;
            border-color: var(--accent-red);
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.45);
            transform: translateY(-2px);
        }

        /* GİRİŞ FORMLARI */
        .mode-form { display: none; flex-direction: column; gap: 15px; }
        .mode-form.active { display: flex; }

        .field-group { display: flex; flex-direction: column; gap: 7px; }
        .field-label {
            font-size: 0.82rem; font-weight: 800; color: #ccc;
            text-transform: uppercase; letter-spacing: 0.8px;
        }
        .qr-input, .qr-textarea, .qr-select {
            width: 100%; background: #050000; border: 1px solid #660000;
            color: #fff; padding: 13px 16px; border-radius: 10px;
            font-size: 0.95rem; outline: none; transition: border-color 0.25s, box-shadow 0.25s;
        }
        .qr-textarea { height: 110px; resize: vertical; line-height: 1.5; }
        .qr-input:focus, .qr-textarea:focus, .qr-select:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .wifi-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
        }
        .checkbox-label {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem; font-weight: 700; color: #ddd; margin-top: 4px;
        }
        .checkbox-label input {
            width: 18px; height: 18px; accent-color: var(--accent-red);
        }

        /* RENK VE STİL ÖZELLEŞTİRME BÖLÜMÜ */
        .customization-box {
            background: rgba(20, 0, 0, 0.6); border: 1px solid #3a0000;
            border-radius: 14px; padding: 20px;
            display: flex; flex-direction: column; gap: 18px;
        }

        .preset-themes {
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .preset-btn {
            background: rgba(10, 0, 0, 0.85); border: 1px solid #550000;
            color: #ddd; padding: 7px 13px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 800; display: flex; align-items: center; gap: 7px;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            border-color: var(--accent-red); color: #fff;
            transform: translateY(-2px); box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
        }
        .swatch-pair {
            display: inline-flex; width: 18px; height: 18px; border-radius: 50%;
            overflow: hidden; border: 1px solid #fff;
        }
        .swatch-half { width: 50%; height: 100%; }

        .color-pickers-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        .color-picker-wrap {
            display: flex; align-items: center; gap: 10px;
            background: #050000; border: 1px solid #550000;
            padding: 8px 12px; border-radius: 10px;
        }
        .color-picker-wrap input[type="color"] {
            width: 38px; height: 34px; border: none; background: none; outline: none;
        }
        .color-hex-text {
            font-family: 'Courier New', monospace; font-weight: 900;
            font-size: 0.92rem; color: #fff; text-transform: uppercase;
        }

        .options-row-3 {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }

        /* SAĞ PANEL: CANLI QR ÖNİZLEME VE PNG İNDİRME */
        .preview-panel {
            background: var(--panel-bg); border: 2px solid var(--accent-red);
            border-radius: 18px; padding: 28px;
            box-shadow: 0 0 45px rgba(255, 0, 0, 0.28);
            backdrop-filter: blur(14px);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            position: sticky; top: 90px;
        }

        .qr-frame-stage {
            position: relative; padding: 20px;
            background: radial-gradient(circle, rgba(40, 0, 0, 0.6) 0%, rgba(8, 0, 0, 0.95) 100%);
            border: 2px solid #550000; border-radius: 16px;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.35), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .qr-frame-stage:hover {
            transform: scale(1.02); border-color: var(--accent-red);
        }

        #qrOutputCanvas {
            width: 290px; height: 290px;
            border-radius: 10px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.85);
            background: #ffffff;
        }

        .qr-meta-badges {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        }
        .meta-pill {
            font-size: 0.76rem; font-weight: 800; color: #ffaaaa;
            background: rgba(35, 0, 0, 0.8); border: 1px solid #550000;
            padding: 5px 12px; border-radius: 15px; font-family: monospace;
        }

        .action-buttons-col {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }
        .download-png-btn {
            width: 100%; padding: 15px 20px;
            background: linear-gradient(135deg, #cc0000, #ff0000);
            border: 2px solid #ff5555; border-radius: 30px;
            color: #fff; font-size: 1rem; font-weight: 900;
            letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .download-png-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.9);
        }

        .secondary-btns-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;
        }
        .sec-btn {
            background: rgba(25, 0, 0, 0.85); border: 1px solid var(--accent-red);
            color: #fff; padding: 11px 14px; border-radius: 25px;
            font-size: 0.84rem; font-weight: 800; transition: all 0.2s;
        }
        .sec-btn:hover {
            background: rgba(255, 0, 0, 0.25); box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .toast-status {
            font-size: 0.82rem; font-weight: 800; color: var(--accent-green);
            min-height: 20px; text-align: center;
        }

        /* ALT PANEL: SON OLUŞTURULAN QR KODLAR GEÇMİŞİ */
        .history-panel {
            background: var(--panel-bg); border: 1px solid #440000;
            border-radius: 16px; padding: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.85);
        }
        .history-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid #330000; padding-bottom: 10px;
        }
        .history-header h3 { font-size: 1.1rem; font-weight: 900; color: #ff4444; }
        .clear-btn {
            background: rgba(40, 0, 0, 0.8); border: 1px solid #660000; color: #ccc;
            padding: 6px 14px; border-radius: 6px; font-size: 0.78rem; font-weight: 800; transition: 0.2s;
        }
        .clear-btn:hover { background: var(--accent-red); color: #fff; }

        .history-cards {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px;
        }
        .hist-card {
            background: rgba(20, 0, 0, 0.75); border: 1px solid #3a0000;
            border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 12px;
            transition: border-color 0.2s, transform 0.2s;
        }
        .hist-card:hover {
            border-color: var(--accent-red); transform: translateY(-2px);
        }
        .hist-thumb {
            width: 54px; height: 54px; border-radius: 6px; background: #fff;
            padding: 3px; flex-shrink: 0; object-fit: contain;
        }
        .hist-info {
            overflow: hidden; flex-grow: 1;
        }
        .hist-type {
            font-size: 0.7rem; font-weight: 900; color: var(--accent-gold);
            text-transform: uppercase;
        }
        .hist-text {
            font-size: 0.85rem; color: #eee; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin: 2px 0;
        }
        .hist-date { font-size: 0.7rem; color: #888; }

        @media (max-width: 1024px) {
            .studio-grid { grid-template-columns: 1fr; }
            .preview-panel { position: static; }
        }
        @media (max-width: 650px) {
            .mode-tabs, .wifi-row, .color-pickers-row, .options-row-3 { grid-template-columns: 1fr; }
            nav { padding: 1rem 1.2rem; }
        }
        @media (pointer: coarse) {
            .custom-cursor { display: none !important; }
            * { cursor: auto !important; }
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>

    <!-- SHARINGAN AÇILIŞ EKRANI -->
    <div id="splash">
        <svg class="sharingan" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#990000" stroke="#111" stroke-width="4"/>
            <circle cx="50" cy="50" r="24" fill="none" stroke="#111" stroke-width="2" opacity="0.6"/>
            <circle cx="50" cy="50" r="8" fill="#000"/>
            <g>
                <g transform="translate(50, 26)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
                <g transform="translate(71, 62) rotate(120)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
                <g transform="translate(29, 62) rotate(240)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
            </g>
        </svg>
        <div class="logo-container">
            <div class="logo-text">yigitqwc</div>
            <div class="red-line-wrapper"></div>
        </div>
    </div>

    <div class="hero-bg"></div>
    <div class="vignette"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- ÜST MENÜ -->
    <nav>
        <div class="nav-left">
            <a href="index.html" class="logo-container hover-target">
                <div class="logo-text">yigitqwc</div>
                <div class="red-line-wrapper"></div>
            </a>
            <span class="module-badge">🔳 Vtab // QR Kod Oluşturucu</span>
        </div>
        <div class="nav-right">
            <a href="index24.html" class="back-link hover-target">← Vtab Merkezi</a>
            <a href="index.html" class="back-link hover-target">Ana Sayfa</a>
        </div>
    </nav>

    <!-- ANA İÇERİK -->
    <main class="qr-studio-wrapper">

        <div class="studio-grid">

            <!-- SOL PANEL: İÇERİK SEÇİMİ VE TASARIM AYARLARI -->
            <section class="config-panel">
                <div class="panel-title">
                    <div>⚙️ <span>QR Kod</span> İçerik & Tasarım Ayarları</div>
                </div>

                <!-- 1. QR TÜRÜ SEKMELERİ -->
                <div class="mode-tabs">
                    <button class="mode-tab-btn active hover-target" id="tabUrl" onclick="switchQrMode('url')">🔗 Web Sitesi (URL)</button>
                    <button class="mode-tab-btn hover-target" id="tabText" onclick="switchQrMode('text')">📝 Serbest Metin</button>
                    <button class="mode-tab-btn hover-target" id="tabWifi" onclick="switchQrMode('wifi')">📶 Wi-Fi Bağlantısı</button>
                </div>

                <!-- FORM 1: URL -->
                <div class="mode-form active" id="formUrl">
                    <div class="field-group">
                        <label class="field-label" for="inputUrl">Web Sitesi Adresi (URL)</label>
                        <input type="url" id="inputUrl" class="qr-input hover-target" value="https://www.instagram.com/yigitqwc/" placeholder="https://ornek.com" oninput="generateQrCode()">
                    </div>
                </div>

                <!-- FORM 2: SERBEST METİN -->
                <div class="mode-form" id="formText">
                    <div class="field-group">
                        <label class="field-label" for="inputText">Metin, Mesaj veya Kartvizit Notu</label>
                        <textarea id="inputText" class="qr-textarea hover-target" placeholder="QR kod okutulduğunda görünecek metni buraya yazın..." oninput="generateQrCode()">yigitqwc | Uchiha Bilgi Bankası & Dijital Sistem Merkezi</textarea>
                    </div>
                </div>

                <!-- FORM 3: WI-FI BİLGİLERİ -->
                <div class="mode-form" id="formWifi">
                    <div class="wifi-row">
                        <div class="field-group">
                            <label class="field-label" for="wifiSsid">Wi-Fi Ağ Adı (SSID)</label>
                            <input type="text" id="wifiSsid" class="qr-input hover-target" placeholder="Örn: Uchiha_5G_Fiber" value="yigitqwc_WiFi" oninput="generateQrCode()">
                        </div>
                        <div class="field-group">
                            <label class="field-label" for="wifiPass">Wi-Fi Şifresi</label>
                            <input type="text" id="wifiPass" class="qr-input hover-target" placeholder="Ağ parolasını girin..." value="uchiha2026" oninput="generateQrCode()">
                        </div>
                    </div>
                    <div class="wifi-row">
                        <div class="field-group">
                            <label class="field-label" for="wifiEnc">Şifreleme Türü</label>
                            <select id="wifiEnc" class="qr-select hover-target" onchange="generateQrCode()">
                                <option value="WPA" selected>WPA / WPA2 / WPA3</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">Şifresiz (Açık Ağ)</option>
                            </select>
                        </div>
                        <div class="field-group" style="justify-content:center;">
                            <label class="checkbox-label hover-target">
                                <input type="checkbox" id="wifiHidden" onchange="generateQrCode()">
                                Gizli Wi-Fi Ağı (SSID Gizli)
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 2. RENK VE GÖRÜNÜM ÖZELLEŞTİRME -->
                <div class="customization-box">
                    <div class="field-label">🎨 Hazır Renk Temaları</div>
                    <div class="preset-themes">
                        <button class="preset-btn hover-target" onclick="applyTheme('#000000', '#FFFFFF')">
                            <span class="swatch-pair"><span class="swatch-half" style="background:#000"></span><span class="swatch-half" style="background:#fff"></span></span>
                            Klasik Siyah-Beyaz
                        </button>
                        <button class="preset-btn hover-target" onclick="applyTheme('#B80000', '#FFFFFF')">
                            <span class="swatch-pair"><span class="swatch-half" style="background:#B80000"></span><span class="swatch-half" style="background:#fff"></span></span>
                            Uchiha Kırmızısı
                        </button>
                        <button class="preset-btn hover-target" onclick="applyTheme('#FF1111', '#080101')">
                            <span class="swatch-pair"><span class="swatch-half" style="background:#FF1111"></span><span class="swatch-half" style="background:#080101"></span></span>
                            Karanlık Sharingan
                        </button>
                        <button class="preset-btn hover-target" onclick="applyTheme('#111111', '#FFCC00')">
                            <span class="swatch-pair"><span class="swatch-half" style="background:#111"></span><span class="swatch-half" style="background:#FFCC00"></span></span>
                            Altın Kontrast
                        </button>
                        <button class="preset-btn hover-target" onclick="applyTheme('#00FF66', '#040804')">
                            <span class="swatch-pair"><span class="swatch-half" style="background:#00FF66"></span><span class="swatch-half" style="background:#040804"></span></span>
                            Matrix Terminali
                        </button>
                    </div>

                    <div class="color-pickers-row">
                        <div class="field-group">
                            <label class="field-label" for="fgColorPicker">QR Nokta Rengi (Ön Plan)</label>
                            <div class="color-picker-wrap hover-target">
                                <input type="color" id="fgColorPicker" value="#000000" oninput="onCustomColorChange()">
                                <span class="color-hex-text" id="fgHexLabel">#000000</span>
                            </div>
                        </div>

                        <div class="field-group">
                            <label class="field-label" for="bgColorPicker">Arka Plan Rengi</label>
                            <div class="color-picker-wrap hover-target">
                                <input type="color" id="bgColorPicker" value="#FFFFFF" oninput="onCustomColorChange()">
                                <span class="color-hex-text" id="bgHexLabel">#FFFFFF</span>
                            </div>
                        </div>
                    </div>

                    <div class="options-row-3">
                        <div class="field-group">
                            <label class="field-label" for="qrSizeSelect">Çıktı Boyutu (PNG)</label>
                            <select id="qrSizeSelect" class="qr-select hover-target" onchange="generateQrCode()">
                                <option value="300">300 x 300 px</option>
                                <option value="512" selected>512 x 512 px (HD)</option>
                                <option value="800">800 x 800 px (Baskı)</option>
                                <option value="1024">1024 x 1024 px (Ultra)</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label class="field-label" for="qrEccSelect">Hata Düzeltme</label>
                            <select id="qrEccSelect" class="qr-select hover-target" onchange="generateQrCode()">
                                <option value="L">Düşük (L - %7)</option>
                                <option value="M">Orta (M - %15)</option>
                                <option value="Q">Yüksek (Q - %25)</option>
                                <option value="H" selected>Maksimum (H - %30)</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label class="field-label" for="qrBadgeSelect">Merkez Amblem</label>
                            <select id="qrBadgeSelect" class="qr-select hover-target" onchange="generateQrCode()">
                                <option value="none">Amblem Yok (Saf QR)</option>
                                <option value="sharingan" selected>👁️ Sharingan Amblemi</option>
                                <option value="yigitqwc">⚡ yigitqwc Rozeti</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SAĞ PANEL: CANLI ÖNİZLEME VE PNG İNDİRME -->
            <aside class="preview-panel">
                <div class="panel-title" style="width:100%;">
                    <div>👁️ <span>Canlı QR</span> Önizleme</div>
                    <span style="font-size:0.78rem; color:#aaa;" id="activeModeLabel">MOD: URL</span>
                </div>

                <div class="qr-frame-stage hover-target">
                    <canvas id="qrOutputCanvas" width="512" height="512"></canvas>
                </div>

                <div class="qr-meta-badges">
                    <span class="meta-pill" id="metaSizePill">512x512 px</span>
                    <span class="meta-pill" id="metaEccPill">ECC: H (%30)</span>
                    <span class="meta-pill" id="metaCharPill">35 Karakter</span>
                </div>

                <div class="action-buttons-col">
                    <button class="download-png-btn hover-target" onclick="downloadQrAsPng()">
                        💾 PNG OLARAK İNDİR
                    </button>
                    <div class="secondary-btns-row">
                        <button class="sec-btn hover-target" onclick="copyQrToClipboard()">📋 Görseli Kopyala</button>
                        <button class="sec-btn hover-target" onclick="saveCurrentToHistory()">📌 Geçmişe Kaydet</button>
                    </div>
                </div>

                <div class="toast-status" id="qrToastStatus"></div>
            </aside>

        </div>

        <!-- ALT PANEL: KAYITLI QR KOD GEÇMİŞİ -->
        <section class="history-panel">
            <div class="history-header">
                <h3>🕒 Kaydedilen QR Kodlar (localStorage)</h3>
                <button class="clear-btn hover-target" onclick="clearQrHistory()">Geçmişi Temizle</button>
            </div>
            <div class="history-cards" id="qrHistoryGrid"></div>
        </section>

    </main>

    <!-- QRIOUS KÜTÜPHANESİ (SAF CANVAS TABANLI ANLIK QR MOTORU) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script>
        let currentMode = 'url';
        const STORAGE_KEY_QR = 'yigitqwc_vtab_qr_history_v1';

        function switchQrMode(mode) {
            currentMode = mode;
            document.getElementById('tabUrl').classList.toggle('active', mode === 'url');
            document.getElementById('tabText').classList.toggle('active', mode === 'text');
            document.getElementById('tabWifi').classList.toggle('active', mode === 'wifi');

            document.getElementById('formUrl').classList.toggle('active', mode === 'url');
            document.getElementById('formText').classList.toggle('active', mode === 'text');
            document.getElementById('formWifi').classList.toggle('active', mode === 'wifi');

            const labels = { url: 'MOD: WEB SİTESİ (URL)', text: 'MOD: SERBEST METİN', wifi: 'MOD: WI-FI AĞI' };
            document.getElementById('activeModeLabel').innerText = labels[mode];
            generateQrCode();
        }

        // Wi-Fi standart QR dizgesi oluşturucu: WIFI:T:WPA;S:mynetwork;P:mypass;H:true;;
        function escapeWifiField(str) {
            return (str || '').replace(/([\\;,:])/g, '\\$1');
        }

        function getFormattedPayload() {
            if (currentMode === 'url') {
                const val = document.getElementById('inputUrl').value.trim();
                return val || 'https://yigitqwc.com';
            }
            if (currentMode === 'text') {
                const val = document.getElementById('inputText').value.trim();
                return val || 'yigitqwc';
            }
            if (currentMode === 'wifi') {
                const ssid = escapeWifiField(document.getElementById('wifiSsid').value.trim() || 'WiFi_Agim');
                const pass = escapeWifiField(document.getElementById('wifiPass').value.trim());
                const enc = document.getElementById('wifiEnc').value;
                const hidden = document.getElementById('wifiHidden').checked ? 'true' : 'false';
                if (enc === 'nopass') {
                    return `WIFI:T:nopass;S:${ssid};H:${hidden};;`;
                }
                return `WIFI:T:${enc};S:${ssid};P:${pass};H:${hidden};;`;
            }
            return 'yigitqwc';
        }

        function applyTheme(fg, bg) {
            document.getElementById('fgColorPicker').value = fg;
            document.getElementById('bgColorPicker').value = bg;
            document.getElementById('fgHexLabel').innerText = fg.toUpperCase();
            document.getElementById('bgHexLabel').innerText = bg.toUpperCase();
            generateQrCode();
        }

        function onCustomColorChange() {
            const fg = document.getElementById('fgColorPicker').value;
            const bg = document.getElementById('bgColorPicker').value;
            document.getElementById('fgHexLabel').innerText = fg.toUpperCase();
            document.getElementById('bgHexLabel').innerText = bg.toUpperCase();
            generateQrCode();
        }

        // Merkez Amblemini (Sharingan veya yigitqwc) QR Canvas Üzerine İşle
        function drawCenterBadge(ctx, size, badgeType, bgColor, fgColor) {
            if (badgeType === 'none') return;
            const cx = size / 2;
            const cy = size / 2;
            const boxR = size * 0.115;

            ctx.save();
            // Koruyucu çerçeve
            ctx.beginPath();
            ctx.arc(cx, cy, boxR + 5, 0, Math.PI * 2);
            ctx.fillStyle = bgColor;
            ctx.fill();

            if (badgeType === 'sharingan') {
                // Sharingan Gözü Çizimi
                ctx.beginPath();
                ctx.arc(cx, cy, boxR, 0, Math.PI * 2);
                ctx.fillStyle = '#bb0000';
                ctx.fill();
                ctx.lineWidth = Math.max(2, size * 0.007);
                ctx.strokeStyle = '#111111';
                ctx.stroke();

                // İç halka
                ctx.beginPath();
                ctx.arc(cx, cy, boxR * 0.56, 0, Math.PI * 2);
                ctx.lineWidth = Math.max(1.5, size * 0.004);
                ctx.strokeStyle = 'rgba(0,0,0,0.65)';
                ctx.stroke();

                // Göz bebeği
                ctx.beginPath();
                ctx.arc(cx, cy, boxR * 0.22, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();

                // 3 Tomoe
                for (let i = 0; i < 3; i++) {
                    const angle = (i * 120 - 90) * (Math.PI / 180);
                    const tx = cx + Math.cos(angle) * (boxR * 0.56);
                    const ty = cy + Math.sin(angle) * (boxR * 0.56);
                    ctx.beginPath();
                    ctx.arc(tx, ty, boxR * 0.14, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                }
            } else if (badgeType === 'yigitqwc') {
                ctx.beginPath();
                ctx.arc(cx, cy, boxR, 0, Math.PI * 2);
                ctx.fillStyle = '#090101';
                ctx.fill();
                ctx.lineWidth = Math.max(2, size * 0.006);
                ctx.strokeStyle = '#ff0000';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = `900 ${Math.round(boxR * 0.42)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('yigit', cx, cy - boxR * 0.18);
                ctx.fillStyle = '#ff2222';
                ctx.fillText('qwc', cx, cy + boxR * 0.25);
            }
            ctx.restore();
        }

        // ANA QR KOD ÜRETİM FONKSİYONU
        function generateQrCode() {
            const payload = getFormattedPayload();
            const size = parseInt(document.getElementById('qrSizeSelect').value, 10) || 512;
            const level = document.getElementById('qrEccSelect').value || 'H';
            const fg = document.getElementById('fgColorPicker').value || '#000000';
            const bg = document.getElementById('bgColorPicker').value || '#FFFFFF';
            const badge = document.getElementById('qrBadgeSelect').value;

            const canvas = document.getElementById('qrOutputCanvas');
            canvas.width = size;
            canvas.height = size;

            if (typeof QRious !== 'undefined') {
                new QRious({
                    element: canvas,
                    value: payload,
                    size: size,
                    level: level,
                    foreground: fg,
                    background: bg,
                    padding: Math.round(size * 0.05)
                });
                const ctx = canvas.getContext('2d');
                drawCenterBadge(ctx, size, badge, bg, fg);
            } else {
                // Yedek çizim (CDN engellenirse)
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, size, size);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                const cleanFg = fg.replace('#', '');
                const cleanBg = bg.replace('#', '');
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, size, size);
                    drawCenterBadge(ctx, size, badge, bg, fg);
                };
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&ecc=${level}&color=${cleanFg}&bgcolor=${cleanBg}&margin=2&data=${encodeURIComponent(payload)}`;
            }

            document.getElementById('metaSizePill').innerText = `${size}x${size} px`;
            document.getElementById('metaEccPill').innerText = `ECC: ${level}`;
            document.getElementById('metaCharPill').innerText = `${payload.length} Karakter`;
        }

        function showToast(msg) {
            const el = document.getElementById('qrToastStatus');
            el.innerText = msg;
            setTimeout(() => {
                if (el.innerText === msg) el.innerText = '';
            }, 3200);
        }

        // PNG OLARAK İNDİR
        function downloadQrAsPng() {
            const canvas = document.getElementById('qrOutputCanvas');
            const dataUrl = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `yigitqwc_qr_${currentMode}_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            saveCurrentToHistory(false);
            showToast('✓ QR Kod yüksek çözünürlüklü PNG olarak indirildi!');
        }

        // PANOYA KOPYALA
        async function copyQrToClipboard() {
            const canvas = document.getElementById('qrOutputCanvas');
            try {
                canvas.toBlob(async (blob) => {
                    if (!blob) return;
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    showToast('✓ QR Kod görseli panoya kopyalandı!');
                });
            } catch (e) {
                showToast('ℹ️ Tarayıcınız doğrudan görsel kopyalamayı kısıtlıyor, PNG İndir butonunu kullanın.');
            }
        }

        // GEÇMİŞE KAYDET (LOCALSTORAGE)
        function saveCurrentToHistory(notify = true) {
            const canvas = document.getElementById('qrOutputCanvas');
            const payload = getFormattedPayload();
            const thumbData = canvas.toDataURL('image/png');

            let list = [];
            try { list = JSON.parse(localStorage.getItem(STORAGE_KEY_QR) || '[]'); } catch (e) {}

            // Aynı içerik zaten en üstteyse tekrar ekleme
            if (list.length > 0 && list[0].payload === payload) {
                if (notify) showToast('✓ Bu QR Kod zaten geçmişte kayıtlı.');
                return;
            }

            const nowStr = new Date().toLocaleString('tr-TR', {
                day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
            });

            list.unshift({
                mode: currentMode.toUpperCase(),
                payload: payload,
                thumb: thumbData,
                time: nowStr
            });

            list = list.slice(0, 8);
            localStorage.setItem(STORAGE_KEY_QR, JSON.stringify(list));
            renderQrHistory();
            if (notify) showToast('✓ QR Kod geçmişe kaydedildi!');
        }

        function renderQrHistory() {
            const grid = document.getElementById('qrHistoryGrid');
            let list = [];
            try { list = JSON.parse(localStorage.getItem(STORAGE_KEY_QR) || '[]'); } catch (e) {}

            if (list.length === 0) {
                grid.innerHTML = `<div style="color:#777; font-size:0.88rem; grid-column:1/-1; text-align:center; padding:12px;">Henüz kaydedilmiş QR kod yok. İndirdiğiniz veya kaydettiğiniz kodlar burada listelenir.</div>`;
                return;
            }

            grid.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'hist-card hover-target';
                card.onclick = () => {
                    const a = document.createElement('a');
                    a.href = item.thumb;
                    a.download = `yigitqwc_qr_arsiv.png`;
                    a.click();
                };

                const img = document.createElement('img');
                img.src = item.thumb;
                img.className = 'hist-thumb';
                img.alt = 'QR';

                const info = document.createElement('div');
                info.className = 'hist-info';

                const typeDiv = document.createElement('div');
                typeDiv.className = 'hist-type';
                typeDiv.textContent = `${item.mode} • İndirmek için tıkla`;

                const textDiv = document.createElement('div');
                textDiv.className = 'hist-text';
                textDiv.textContent = item.payload;

                const dateDiv = document.createElement('div');
                dateDiv.className = 'hist-date';
                dateDiv.textContent = item.time;

                info.appendChild(typeDiv);
                info.appendChild(textDiv);
                info.appendChild(dateDiv);

                card.appendChild(img);
                card.appendChild(info);
                grid.appendChild(card);
            });
        }

        function clearQrHistory() {
            localStorage.removeItem(STORAGE_KEY_QR);
            renderQrHistory();
            showToast('🗑️ QR Kod geçmişi temizlendi.');
        }

        // SAYFA YÜKLENİŞİ, İMLEÇ VE ARKA PLAN KÜLLERİ
        window.addEventListener('load', () => {
            generateQrCode();
            renderQrHistory();

            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 700);
            }, 850);
        });

        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.closest('.hover-target')) cursor.classList.add('cursor-hover');
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.hover-target')) cursor.classList.remove('cursor-hover');
        });

        // ARKA PLAN KÜL PARÇACIKLARI
        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        pCanvas.width = window.innerWidth;
        pCanvas.height = window.innerHeight;
        let particles = [];
        for (let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * pCanvas.width,
                y: Math.random() * pCanvas.height,
                s: Math.random() * 2.2 + 0.8,
                sy: Math.random() * 1.4 + 0.4
            });
        }
        function animParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            pCtx.fillStyle = "rgba(255, 0, 0, 0.45)";
            particles.forEach(p => {
                p.y -= p.sy;
                if (p.y < -10) { p.y = pCanvas.height + 10; p.x = Math.random() * pCanvas.width; }
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                pCtx.fill();
            });
            requestAnimationFrame(animParticles);
        }
        animParticles();

        window.addEventListener('resize', () => {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        });
    </script>
</body>
