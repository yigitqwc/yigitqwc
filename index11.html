<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yigitqwc | ABD Bilgi Bankası</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #030101;
            --text-color: #ffffff;
            --accent-red: #ff0000;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: none;
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        }

        /* ÖZEL İMLEÇ VE EFEKTLER */
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 16px; height: 16px;
            background-color: transparent; border: 2px solid var(--accent-red);
            pointer-events: none; z-index: 9999999;
            transform: translate(-50%, -50%) rotate(45deg);
            box-shadow: 0 0 10px var(--accent-red), inset 0 0 5px var(--accent-red);
            transition: width 0.2s, height 0.2s;
        }
        .custom-cursor::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: var(--accent-red); transform: translate(-50%, -50%);
        }
        .cursor-hover { width: 28px; height: 28px; background-color: rgba(255, 0, 0, 0.25); }

        .click-ripple {
            position: fixed; border-radius: 50%; border: 2px solid var(--accent-red);
            pointer-events: none; transform: translate(-50%, -50%);
            animation: rippleEffect 0.6s ease-out forwards; z-index: 99998;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
        }

        /* SHARINGAN YÜKLEME EKRANI */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 99999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .sharingan {
            width: 80px; height: 80px; margin-bottom: 25px;
            animation: spin 2.5s linear infinite; filter: drop-shadow(0 0 15px rgba(255,0,0,0.8));
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .logo-container {
            position: relative; text-decoration: none; color: var(--text-color); display: inline-block; padding-bottom: 4px;
        }
        .logo-text { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; display: inline-block; animation: glitch-anim 6s infinite; }
        @keyframes glitch-anim {
            0%, 93%, 100% { text-shadow: 0 0 15px rgba(255,0,0,0.8); transform: translate(0); }
            94% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, -2px); }
            96% { text-shadow: -3px 0 0 red, 3px 0 0 white; transform: translate(-3px, 2px); }
            98% { text-shadow: 3px 0 0 red, -3px 0 0 white; transform: translate(3px, 2px); }
        }
        .red-line-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255, 0, 0, 0.2); border-radius: 2px; overflow: hidden;
        }
        .red-line-wrapper::after {
            content: ''; position: absolute; top: 0; left: -50%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, #ff0000, #ffffff, #ff0000, transparent);
            box-shadow: 0 0 8px #ff0000; animation: beamMove 2.5s infinite linear;
        }
        @keyframes beamMove { 0% { left: -50%; } 100% { left: 100%; } }

        /* ARKA PLAN VE KÜLLER */
        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-color: #020000; filter: brightness(0.2); z-index: -2; pointer-events: none;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,0.98) 100%); pointer-events: none; z-index: -1;
        }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        nav {
            background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 3rem; position: relative; z-index: 10;
            border-bottom: 1px solid rgba(255, 0, 0, 0.25); box-shadow: 0 0 20px rgba(255,0,0,0.2);
        }
        .back-link { color: #aaa; text-decoration: none; font-size: 1rem; font-weight: 600; transition: color 0.3s; }
        .back-link:hover { color: var(--accent-red); }

        /* ANA DÜZEN */
        .world-layout {
            display: flex; flex-grow: 1; height: calc(100vh - 70px); position: relative; z-index: 5;
        }

        /* SOL PANEL (ARAMA VE BİLGİ) */
        .info-panel {
            width: 380px; background: rgba(10, 1, 1, 0.95); border-right: 2px solid #550000;
            padding: 25px; display: flex; flex-direction: column; gap: 15px; box-shadow: 5px 0 25px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px); z-index: 20; position: relative;
        }
        .info-panel h2 { color: #ff3333; font-size: 1.5rem; border-bottom: 1px solid #440000; padding-bottom: 10px; margin-bottom: 5px; }

        /* ARAMA KUTUSU VE LİSTE */
        .search-container { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; overflow: hidden; }
        .search-box {
            width: 100%; padding: 12px 15px; background: #050000; border: 1px solid #770000;
            color: #fff; border-radius: 8px; font-size: 1rem; outline: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-box:focus { border-color: var(--accent-red); box-shadow: 0 0 15px rgba(255,0,0,0.4), inset 0 0 10px rgba(0,0,0,0.8); }
        .search-box::placeholder { color: #555; }

        .city-list {
            list-style: none; overflow-y: auto; flex-grow: 1; padding-right: 5px;
        }
        .city-list::-webkit-scrollbar { width: 6px; }
        .city-list::-webkit-scrollbar-thumb { background: #550000; border-radius: 3px; }
        .city-list li {
            padding: 12px 15px; background: rgba(25, 0, 0, 0.4); border: 1px solid #330000;
            margin-bottom: 8px; border-radius: 6px; color: #ddd; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .city-list li:hover { background: rgba(255, 0, 0, 0.8); color: #fff; border-color: #ff3333; transform: translateX(5px); }

        /* DETAY EKRANI */
        .details-container { display: none; flex-direction: column; gap: 12px; flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .details-container::-webkit-scrollbar { width: 6px; }
        .details-container::-webkit-scrollbar-thumb { background: #550000; border-radius: 3px; }
        
        .city-title { font-size: 2rem; color: #ffffff; text-shadow: 0 0 15px red; font-weight: 900; margin-bottom: 10px; }
        .info-row { background: rgba(20, 0, 0, 0.6); padding: 10px; border-radius: 6px; border-left: 3px solid #ff3333; margin-bottom: 5px; }
        .info-row span { color: var(--accent-red); font-weight: bold; display: block; font-size: 0.85rem; margin-bottom: 3px; }
        .info-row p { color: #e0e0e0; font-size: 0.95rem; line-height: 1.5; }
        
        .back-btn {
            background: #2b0505; border: 1px solid #ff3333; color: #fff; padding: 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; transition: 0.2s;
        }
        .back-btn:hover { background: #ff3333; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

        /* HARİTA ALANI (%75) */
        .map-view-area {
            flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; padding: 20px;
        }
        .us-map-wrapper {
            width: 75vw; height: 75vh; position: relative;
            background-image: url('us.jfif'); /* ABD HARİTASI İÇİN */
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            border: 3px solid #660000; border-radius: 12px; box-shadow: 0 0 60px rgba(255,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>

    <div id="splash">
        <svg class="sharingan" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#990000" stroke="#111" stroke-width="4"/>
            <circle cx="50" cy="50" r="24" fill="none" stroke="#111" stroke-width="2" opacity="0.6"/>
            <circle cx="50" cy="50" r="8" fill="#000"/>
            <g>
                <g transform="translate(50, 26)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
                <g transform="translate(71, 62) rotate(120)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
                <g transform="translate(29, 62) rotate(240)"><circle cx="0" cy="0" r="6" fill="#000"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#000"/></g>
            </g>
        </svg>
        <div class="logo-container">
            <div class="logo-text" style="font-size:2rem;">yigitqwc</div>
            <div class="red-line-wrapper"></div>
        </div>
    </div>

    <div class="hero-bg"></div>
    <div class="vignette"></div>
    <canvas id="particles-canvas"></canvas>

    <nav>
        <a href="index.html" class="logo-container hover-target">
            <div class="logo-text">yigitqwc</div>
            <div class="red-line-wrapper"></div>
        </a>
        <a href="index5.html" class="back-link hover-target">← Dünya Haritası</a>
    </nav>

    <div class="world-layout">
        <!-- SOL PANEL: ARAMA VE DETAYLAR -->
        <div class="info-panel">
            <h2>📍 ABD Veritabanı</h2>
            
            <!-- ARAMA EKRANI -->
            <div class="search-container" id="searchContainer">
                <input type="text" id="citySearch" class="search-box" placeholder="Şehir ara (Örn: New York)..." onkeyup="filterCities()">
                <ul class="city-list" id="cityList">
                    <!-- Javascript ile doldurulacak -->
                </ul>
            </div>

            <!-- DETAY EKRANI -->
            <div class="details-container" id="detailsContainer">
                <div class="city-title" id="d-name">Washington D.C.</div>
                <div class="info-row"><span>Konum (Eyalet/Bölge)</span><p id="d-region">-</p></div>
                <div class="info-row"><span>Posta Kodu (Zip)</span><p id="d-plate">-</p></div>
                <div class="info-row"><span>Nüfus</span><p id="d-pop">-</p></div>
                <div class="info-row"><span>Tarihi Eserler & Yerler</span><p id="d-history">-</p></div>
                <div class="info-row"><span>Meşhur Yemekleri</span><p id="d-food">-</p></div>
                <div class="info-row"><span>Tarihte Yaşanmış Önemli Olaylar</span><p id="d-events">-</p></div>
                <div class="back-btn hover-target" onclick="showSearchPanel()">← Yeni Şehir Ara</div>
            </div>
        </div>

        <!-- HARİTA ALANI (%75) -->
        <div class="map-view-area">
            <div class="us-map-wrapper"></div>
        </div>
    </div>

    <script>
        // ABD ŞEHİRLERİ VERİTABANI
        const cityDatabase = {
            "New York": { region: "Doğu Kıyısı (New York Eyaleti)", plate: "10001", pop: "8.3 Milyon", history: "Özgürlük Heykeli, Times Meydanı, Central Park, Empire State.", food: "NY Dilim Pizza, Sosisli Sandviç (Hot Dog), Cheesecake.", events: "Küresel finans, medya ve kültür merkezidir. 11 Eylül 2001 saldırıları burada, İkiz Kuleler'de yaşanmıştır." },
            "Los Angeles": { region: "Batı Kıyısı (Kaliforniya)", plate: "90001", pop: "3.8 Milyon", history: "Hollywood, Walk of Fame, Griffith Gözlemevi, Santa Monica.", food: "Tacos, In-N-Out Burger, Cobb Salatası.", events: "Küresel sinema ve eğlence endüstrisinin (Hollywood) kalbidir. 1984 ve 2028 Olimpiyatlarına ev sahipliği yapmaktadır." },
            "Chicago": { region: "Ortabatı (Illinois)", plate: "60601", pop: "2.7 Milyon", history: "Willis Kulesi, Millennium Park, Navy Pier, The Bean.", food: "Deep Dish Pizza (Kalın Kenarlı Pizza), Chicago Tarzı Sosisli.", events: "1871 Büyük Chicago Yangını sonrası dünyanın ilk modern gökdelen mimarisinin doğduğu ve geliştiği yerdir." },
            "Washington D.C.": { region: "Doğu Kıyısı (Federal Bölge)", plate: "20001", pop: "700 Bin", history: "Beyaz Saray, Kongre Binası (Capitol), Lincoln Anıtı, Smithsonian.", food: "Half-Smoke Sosisli, Mavi Yengeç Yemekleri.", events: "ABD'nin federal başkentidir. Ülkenin tüm siyasi ve idari kararlarının alındığı, küresel diplomasinin merkezidir." },
            "San Francisco": { region: "Batı Kıyısı (Kaliforniya)", plate: "94101", pop: "800 Bin", history: "Golden Gate Köprüsü, Alcatraz Adası, Lombard Sokağı.", food: "Ekşi Mayalı Ekmekte Clam Chowder, Deniz Ürünleri.", events: "1849 'Altına Hücum' dönemiyle büyümüştür. Günümüzde dünyanın teknoloji ve inovasyon merkezi Silikon Vadisi'ne komşudur." },
            "Las Vegas": { region: "Güneybatı (Nevada)", plate: "89101", pop: "650 Bin", history: "The Strip, Bellagio Çeşmeleri, Fremont Sokağı.", food: "Açık Büfe (All-you-can-eat Buffet), Karides Kokteyli.", events: "Çölün ortasında kumar, eğlence ve gece hayatı üzerine kurulmuş dünya çapında ünlü bir tatil ve şov şehridir." },
            "Miami": { region: "Güneydoğu (Florida)", plate: "33101", pop: "440 Bin", history: "South Beach, Art Deco Tarihi Bölgesi, Little Havana.", food: "Küba Sandviçi, Key Lime Pie (Misket Limonlu Turta).", events: "Latin Amerika kültürünün ABD'deki en büyük temsilcisi, Karayipler'in kapısı ve devasa bir turizm merkezidir." },
            "Boston": { region: "New England (Massachusetts)", plate: "02101", pop: "650 Bin", history: "Özgürlük Yolu (Freedom Trail), Harvard Üniversitesi, Fenway Park.", food: "New England Clam Chowder (İstiridye Çorbası), Istakoz Rulo.", events: "Amerikan Bağımsızlık Savaşı'nın başladığı (Boston Çay Partisi) yerdir. Dünyanın en iyi üniversitelerine ev sahipliği yapar." },
            "Seattle": { region: "Kuzeybatı (Washington)", plate: "98101", pop: "730 Bin", history: "Space Needle, Pike Place Market, Pop Kültür Müzesi.", food: "Somon Balığı, Taze Kavrulmuş Kahve (Starbucks'ın doğduğu yer).", events: "Grunge müziğin (Nirvana, Pearl Jam) ve Amazon, Microsoft gibi dev teknoloji şirketlerinin doğduğu bulutlu şehirdir." },
            "Houston": { region: "Güney (Teksas)", plate: "77001", pop: "2.3 Milyon", history: "NASA Johnson Uzay Merkezi, Houston Doğa Bilimleri Müzesi.", food: "Teksas Barbeküsü (Brisket), Tex-Mex (Teksas-Meksika mutfağı).", events: "ABD'nin enerji (petrol) ve uzay araştırmaları merkezidir. Apollo 13'ün meşhur 'Houston, bir sorunumuz var' sözü buraya aittir." },
            "New Orleans": { region: "Güney (Louisiana)", plate: "70112", pop: "380 Bin", history: "French Quarter (Fransız Mahallesi), Jackson Meydanı, Bourbon Sokağı.", food: "Gumbo, Jambalaya, Beignet, Po'boy Sandviç.", events: "Caz müziğinin doğduğu yerdir. Fransız, İspanyol ve Afrika kültürlerinin eşsiz birleşimidir; her yıl meşhur Mardi Gras festivali yapılır." },
            "Philadelphia": { region: "Doğu Kıyısı (Pensilvanya)", plate: "19101", pop: "1.5 Milyon", history: "Özgürlük Çanı (Liberty Bell), Bağımsızlık Salonu.", food: "Philly Cheesesteak, Yumuşak Pretzel.", events: "ABD'nin kurucu kenti ve ilk başkentidir. Ülkenin Bağımsızlık Bildirgesi ve Anayasası bu şehirde imzalanmıştır." },
            "Detroit": { region: "Ortabatı (Michigan)", plate: "48201", pop: "630 Bin", history: "Detroit Sanat Enstitüsü, Henry Ford Müzesi, Motown Müzesi.", food: "Detroit Tarzı Pizza, Coney Dog (Sosisli).", events: "'Motor City' olarak bilinir; Ford, GM ve Chrysler ile küresel otomotiv endüstrisine yön vermiştir. Motown müziğinin çıkış noktasıdır." },
            "Atlanta": { region: "Güneydoğu (Georgia)", plate: "30301", pop: "500 Bin", history: "World of Coca-Cola, CNN Merkezi, Martin Luther King Jr. Anıtı.", food: "Kızarmış Tavuk, Şeftalili Turta, Sweet Tea.", events: "Sivil Haklar Hareketi'nin kalbidir ve Dr. Martin Luther King Jr.'ın memleketidir. 1996 Yaz Olimpiyatlarına ev sahipliği yapmıştır." },
            "Phoenix": { region: "Güneybatı (Arizona)", plate: "85001", pop: "1.6 Milyon", history: "Çöl Botanik Bahçesi, Camelback Dağı, Grand Canyon (Yakın erişim).", food: "Sonoran Sosislisi, Otantik Meksika Yemekleri.", events: "Güneş Vadisi (Valley of the Sun) olarak bilinir. Sonoran Çölü üzerine kurulu devasa ve hızla büyüyen bir metropoldür." }
        };

        // LİSTEYİ BAŞLANGIÇTA DOLDURMA
        const cityListElement = document.getElementById('cityList');
        function renderList(filter = "") {
            cityListElement.innerHTML = "";
            let keys = Object.keys(cityDatabase);
            
            keys.forEach(city => {
                if (city.toLowerCase().includes(filter.toLowerCase())) {
                    let li = document.createElement("li");
                    li.className = "hover-target";
                    li.innerText = city;
                    li.onclick = () => loadCityDetails(city);
                    cityListElement.appendChild(li);
                }
            });
        }

        // ARAMA FİLTRESİ
        function filterCities() {
            let val = document.getElementById('citySearch').value;
            renderList(val);
        }

        // ŞEHİR DETAYLARINI GÖSTERME
        function loadCityDetails(cityName) {
            let data = cityDatabase[cityName];
            document.getElementById('d-name').innerText = cityName;
            document.getElementById('d-region').innerText = data.region;
            document.getElementById('d-plate').innerText = data.plate;
            document.getElementById('d-pop').innerText = data.pop;
            document.getElementById('d-history').innerText = data.history;
            document.getElementById('d-food').innerText = data.food;
            document.getElementById('d-events').innerText = data.events;

            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('detailsContainer').style.display = 'flex';
        }

        // ARAMA PANELİNE GERİ DÖN
        function showSearchPanel() {
            document.getElementById('detailsContainer').style.display = 'none';
            document.getElementById('searchContainer').style.display = 'flex';
            document.getElementById('citySearch').value = '';
            renderList();
        }

        // YÜKLEME EKRANI
        window.addEventListener('load', () => {
            renderList();
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 800);
            }, 1500);
        });

        // ÖZEL İMLEÇ
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // KÜLLER
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, sy: Math.random() * 1.5 + 0.5 });
        }
        function anim() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255,0,0,0.4)";
            particles.forEach(p => {
                p.y -= p.sy; if (p.y < 0) p.y = canvas.height;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();
    </script>
</body>
</html>
