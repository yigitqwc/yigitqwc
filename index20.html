<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yigitqwc | Arjantin Bilgi Bankası</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* ARJANTİN ÖZEL RENK PALETİ: MAVİ, BEYAZ VE HAFİF SARI */
        :root {
            --bg-color: #020a14; /* Çok koyu okyanus mavisi / gece */
            --text-color: #ffffff;
            --accent-blue: #74acdf; /* Arjantin Mavisi */
            --accent-white: #ffffff;
            --accent-yellow: #fcca46; /* Mayıs Güneşi (Sol de Mayo) Sarısı */
            --panel-bg: rgba(4, 15, 28, 0.95);
            --border-dark: #123252;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: none;
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        }

        /* ÖZEL İMLEÇ VE EFEKTLER (MAVİ/SARI) */
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 16px; height: 16px;
            background-color: transparent; border: 2px solid var(--accent-blue);
            pointer-events: none; z-index: 9999999;
            transform: translate(-50%, -50%) rotate(45deg);
            box-shadow: 0 0 10px var(--accent-blue), inset 0 0 5px var(--accent-blue);
            transition: width 0.2s, height 0.2s;
        }
        .custom-cursor::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: var(--accent-yellow); transform: translate(-50%, -50%);
            box-shadow: 0 0 5px var(--accent-yellow);
        }
        .cursor-hover { width: 28px; height: 28px; background-color: rgba(116, 172, 223, 0.2); border-color: var(--accent-yellow); }

        .click-ripple {
            position: fixed; border-radius: 50%; border: 2px solid var(--accent-blue);
            pointer-events: none; transform: translate(-50%, -50%);
            animation: rippleEffect 0.6s ease-out forwards; z-index: 99998;
            box-shadow: 0 0 15px rgba(116, 172, 223, 0.6);
        }
        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
        }

        /* YÜKLEME EKRANI (ARJANTİN TEMALI) */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #01060a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 99999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .loader-icon {
            width: 85px; height: 85px; margin-bottom: 25px;
            animation: spin 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; 
            filter: drop-shadow(0 0 20px rgba(116, 172, 223, 0.8));
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .logo-container {
            position: relative; text-decoration: none; color: var(--text-color); display: inline-block; padding-bottom: 4px;
        }
        .logo-text { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; display: inline-block; text-shadow: 0 0 15px rgba(116, 172, 223, 0.5); }
        
        .blue-line-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden;
        }
        .blue-line-wrapper::after {
            content: ''; position: absolute; top: 0; left: -50%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-blue), var(--accent-yellow), var(--accent-blue), transparent);
            box-shadow: 0 0 10px var(--accent-blue); animation: beamMove 2.5s infinite linear;
        }
        @keyframes beamMove { 0% { left: -50%; } 100% { left: 100%; } }

        /* ARKA PLAN VE IŞIK PARTİKÜLLERİ */
        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-color: #010812; filter: brightness(0.25); z-index: -2; pointer-events: none;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 20%, rgba(1,8,18,0.95) 100%); pointer-events: none; z-index: -1;
        }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        nav {
            background-color: rgba(2, 10, 20, 0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 3rem; position: relative; z-index: 10;
            border-bottom: 1px solid rgba(116, 172, 223, 0.3); box-shadow: 0 0 25px rgba(116, 172, 223, 0.15);
        }
        .back-link { color: #aaa; text-decoration: none; font-size: 1rem; font-weight: 600; letter-spacing: 0.5px; transition: color 0.3s, text-shadow 0.3s; }
        .back-link:hover { color: var(--accent-blue); text-shadow: 0 0 10px var(--accent-blue); }

        /* ANA DÜZEN */
        .world-layout {
            display: flex; flex-grow: 1; height: calc(100vh - 70px); position: relative; z-index: 5;
        }

        /* SOL PANEL (ARAMA VE BİLGİ) */
        .info-panel {
            width: 380px; background: var(--panel-bg); border-right: 2px solid var(--border-dark);
            padding: 25px; display: flex; flex-direction: column; gap: 15px; box-shadow: 5px 0 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px); z-index: 20; position: relative;
        }
        .info-panel h2 { 
            color: var(--accent-white); font-size: 1.6rem; border-bottom: 1px solid var(--border-dark); 
            padding-bottom: 10px; margin-bottom: 5px; text-shadow: 0 0 10px var(--accent-blue); letter-spacing: 1px;
        }

        /* ARAMA KUTUSU VE LİSTE */
        .search-container { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; overflow: hidden; }
        .search-box {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-dark);
            color: #fff; border-radius: 8px; font-size: 1rem; outline: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-box:focus { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(116, 172, 223, 0.4), inset 0 0 10px rgba(0,0,0,0.8); }
        .search-box::placeholder { color: #777; font-style: italic; }

        .city-list {
            list-style: none; overflow-y: auto; flex-grow: 1; padding-right: 5px;
        }
        .city-list::-webkit-scrollbar { width: 4px; }
        .city-list::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 2px; }
        .city-list li {
            padding: 12px 15px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(116, 172, 223, 0.1);
            margin-bottom: 8px; border-radius: 6px; color: #ddd; font-weight: 500; cursor: pointer; transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        .city-list li:hover { 
            background: rgba(116, 172, 223, 0.15); color: #fff; border-color: var(--accent-blue); 
            transform: translateX(8px); box-shadow: 0 0 15px rgba(116, 172, 223, 0.2);
        }

        /* DETAY EKRANI */
        .details-container { display: none; flex-direction: column; gap: 12px; flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .details-container::-webkit-scrollbar { width: 4px; }
        .details-container::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 2px; }
        
        .city-title { font-size: 2.2rem; color: #ffffff; text-shadow: 0 0 15px var(--accent-blue); font-weight: 900; margin-bottom: 10px; }
        .info-row { background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 8px; border-left: 3px solid var(--accent-yellow); margin-bottom: 5px; }
        .info-row span { color: var(--accent-blue); font-weight: bold; display: block; font-size: 0.85rem; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
        .info-row p { color: #e0e0e0; font-size: 0.95rem; line-height: 1.6; }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--accent-blue); color: #fff; padding: 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; transition: all 0.3s;
            letter-spacing: 1px;
        }
        .back-btn:hover { background: var(--accent-blue); color: #000; box-shadow: 0 0 20px rgba(116, 172, 223, 0.6); }

        /* HARİTA ALANI (%75) */
        .map-view-area {
            flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; padding: 20px;
        }
        .ar-map-wrapper {
            width: 75vw; height: 75vh; position: relative;
            background-image: url('ar.jfif'); /* ARJANTİN HARİTASI İÇİN */
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            border: 2px solid rgba(116, 172, 223, 0.3); border-radius: 16px; 
            box-shadow: 0 0 50px rgba(116, 172, 223, 0.15), inset 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>

    <div id="splash">
        <svg class="loader-icon" viewBox="0 0 100 100">
            <!-- ARJANTİN TEMALI GEOMETRİK YÜKLEYİCİ -->
            <circle cx="50" cy="50" r="45" fill="#021526" stroke="#74acdf" stroke-width="4"/>
            <circle cx="50" cy="50" r="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
            <circle cx="50" cy="50" r="8" fill="#fcca46"/>
            <g>
                <g transform="translate(50, 26)"><circle cx="0" cy="0" r="6" fill="#ffffff"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#ffffff"/></g>
                <g transform="translate(71, 62) rotate(120)"><circle cx="0" cy="0" r="6" fill="#ffffff"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#ffffff"/></g>
                <g transform="translate(29, 62) rotate(240)"><circle cx="0" cy="0" r="6" fill="#ffffff"/><path d="M -6 0 Q -10 -15 5 -15 Q 0 -5 6 0 Z" fill="#ffffff"/></g>
            </g>
        </svg>
        <div class="logo-container">
            <div class="logo-text">yigitqwc</div>
            <div class="blue-line-wrapper"></div>
        </div>
    </div>

    <div class="hero-bg"></div>
    <div class="vignette"></div>
    <canvas id="particles-canvas"></canvas>

    <nav>
        <a href="index.html" class="logo-container hover-target">
            <div class="logo-text" style="font-size: 1.8rem;">yigitqwc</div>
            <div class="blue-line-wrapper"></div>
        </a>
        <a href="index5.html" class="back-link hover-target">← Dünya Haritası</a>
    </nav>

    <div class="world-layout">
        <!-- SOL PANEL: ARAMA VE DETAYLAR -->
        <div class="info-panel">
            <h2>🇦🇷 Arjantin Veritabanı</h2>
            
            <!-- ARAMA EKRANI -->
            <div class="search-container" id="searchContainer">
                <input type="text" id="citySearch" class="search-box hover-target" placeholder="Şehir ara (Örn: Buenos Aires)..." onkeyup="filterCities()">
                <ul class="city-list" id="cityList">
                    <!-- Javascript ile doldurulacak -->
                </ul>
            </div>

            <!-- DETAY EKRANI -->
            <div class="details-container" id="detailsContainer">
                <div class="city-title" id="d-name">Buenos Aires</div>
                <div class="info-row"><span>Konum (Eyalet/Bölge)</span><p id="d-region">-</p></div>
                <div class="info-row"><span>Posta Kodu</span><p id="d-plate">-</p></div>
                <div class="info-row"><span>Nüfus</span><p id="d-pop">-</p></div>
                <div class="info-row"><span>Tarihi Eserler & Yerler</span><p id="d-history">-</p></div>
                <div class="info-row"><span>Meşhur Yemekleri</span><p id="d-food">-</p></div>
                <div class="info-row"><span>Tarihte Yaşanmış Önemli Olaylar</span><p id="d-events">-</p></div>
                <div class="back-btn hover-target" onclick="showSearchPanel()">← Yeni Şehir Ara</div>
            </div>
        </div>

        <!-- HARİTA ALANI (%75) -->
        <div class="map-view-area">
            <div class="ar-map-wrapper hover-target"></div>
        </div>
    </div>

    <script>
        // ARJANTİN ŞEHİRLERİ VERİTABANI
        const cityDatabase = {
            "Buenos Aires": { region: "CABA (Özerk Şehir)", plate: "C1000", pop: "3 Milyon (Metropol 15 Milyon)", history: "Dikilitaş (Obelisco), Casa Rosada, La Boca (Caminito), Teatro Colón, Recoleta Mezarlığı.", food: "Asado (Geleneksel Arjantin Barbeküsü), Empanadas, Choripán, Alfajores, Dulce de Leche.", events: "Arjantin'in başkenti ve Latin Amerika'nın en büyük metropollerinden biridir. Tango dansının doğduğu, Avrupa mimarisi nedeniyle 'Güney Amerika'nın Paris'i' olarak anılan şehirdir." },
            "Córdoba": { region: "Córdoba Eyaleti", plate: "X5000", pop: "1.5 Milyon", history: "Manzana Jesuítica (Cizvit Bloğu - UNESCO), Paseo del Buen Pastor, Sarmiento Parkı.", food: "Fernet con Cola (Şehrin sembol içeceği), Lomito Sandviçi, Córdoba Alfajorları.", events: "Arjantin'in en eski üniversitesine (1613) ev sahipliği yapar. Sömürge döneminden kalma muazzam mimarisi ve büyük öğrenci nüfusuyla bilinir." },
            "Rosario": { region: "Santa Fe Eyaleti", plate: "S2000", pop: "1.2 Milyon", history: "Monumento Nacional a la Bandera (Ulusal Bayrak Anıtı), Paraná Nehri sahilleri, Baigorria.", food: "Boga ve Surubí (Paraná nehri balıkları), Carlito Sandviçi.", events: "Arjantin bayrağının General Manuel Belgrano tarafından ilk kez göndere çekildiği şehirdir. Ayrıca Lionel Messi ve Che Guevara'nın doğduğu yerdir." },
            "Mendoza": { region: "Mendoza Eyaleti", plate: "M5500", pop: "1.1 Milyon", history: "Aconcagua Dağı (Güney Amerika'nın zirvesi), General San Martín Parkı, Bağımsızlık Meydanı.", food: "Malbec Şarabı, Asado, Humita, Tomates Rellenos.", events: "And Dağları'nın eteklerinde, dünyanın en önemli şarap (özellikle Malbec) başkentlerinden biridir. General San Martín'in And Dağları'nı geçmek için ordusunu topladığı yerdir." },
            "Ushuaia": { region: "Tierra del Fuego", plate: "V9410", pop: "80 Bin", history: "Tierra del Fuego Ulusal Parkı, Beagle Kanalı, Dünyanın Sonu Müzesi (Museo del Fin del Mundo).", food: "Centolla (Kral Yengeç), Merluza Negra (Patagonya Diş Balığı), Cordero Fueguino (Kuzu).", events: "Dünyanın en güneyindeki şehirdir ve 'Dünyanın Sonu' (Fin del Mundo) olarak anılır. Antarktika seferlerinin ana başlangıç noktasıdır." },
            "San Carlos de Bariloche": { region: "Río Negro", plate: "R8400", pop: "130 Bin", history: "Nahuel Huapi Gölü, Cerro Catedral (Kayak Merkezi), Centro Cívico.", food: "El yapımı Bariloche Çikolatası, Patagonya Alabalığı (Trucha), Fondu.", events: "Patagonya bölgesinde, İsviçre/Alp tarzı ahşap mimarisi, gölleri, ormanları ve Güney Amerika'nın en büyük kayak merkezleriyle ünlüdür." },
            "Mar del Plata": { region: "Buenos Aires Eyaleti", plate: "B7600", pop: "650 Bin", history: "Casino Central, Torre Tanque, Bristol Plajı, Mar del Plata Limanı.", food: "Deniz Ürünleri, Kalamar, Medialunas (Arjantin Kruvasanı), Churros.", events: "Arjantin'in yazlık başkenti ve en büyük sahil tatil beldesidir. Ülkenin en önemli balıkçılık limanlarından birine sahiptir." },
            "Salta": { region: "Salta Eyaleti", plate: "A4400", pop: "530 Bin", history: "MAAM (Yüksek İrtifa Arkeoloji Müzesi), Cerro San Bernardo, Salta Katedrali.", food: "Empanadas Salteñas, Locro (Mısır ve et yahnisi), Tamales.", events: "İspanyol sömürge mimarisini çok iyi koruduğu için 'Salta la Linda' (Güzel Salta) olarak anılır. And kültürünün en yoğun yaşandığı kuzey şehridir." },
            "Puerto Iguazú": { region: "Misiones Eyaleti", plate: "N3370", pop: "80 Bin", history: "Iguazú Şelaleleri (UNESCO Dünya Mirası ve Dünyanın 7 Yeni Harikası), Üç Sınır İşareti (Arjantin, Brezilya, Paraguay).", food: "Chipa (Peynirli ekmek), Surubí ızgara, Yerba Mate.", events: "Dünyanın en büyük ve görkemli şelale sistemlerinden biri olan Iguazú'ya ev sahipliği yapar. Devasa tropikal ormanların kalbidir." },
            "El Calafate": { region: "Santa Cruz Eyaleti", plate: "Z9405", pop: "25 Bin", history: "Perito Moreno Buzulu (Los Glaciares Ulusal Parkı), Glaciarium Müzesi, Lago Argentino.", food: "Cordero Patagónico (Patagonya Kuzusu Barbeküsü), Calafate Meyvesi reçeli.", events: "Dünyanın en aktif ve erişilebilir buzullarından biri olan, sürekli ilerleyen devasa Perito Moreno Buzulu'nun giriş kapısıdır." },
            "Tucumán (San Miguel de)": { region: "Tucumán Eyaleti", plate: "T4000", pop: "800 Bin", history: "Casa Histórica de la Independencia, 9 Temmuz Parkı, San Miguel Katedrali.", food: "Empanadas Tucumanas, Sanguche de Milanesa.", events: "Arjantin'in bağımsızlık bildirgesinin 9 Temmuz 1816'da imzalandığı tarihi ev burada bulunur. 'Cumhuriyetin Bahçesi' olarak bilinir." }
        };

        // LİSTEYİ BAŞLANGIÇTA DOLDURMA
        const cityListElement = document.getElementById('cityList');
        function renderList(filter = "") {
            cityListElement.innerHTML = "";
            let keys = Object.keys(cityDatabase);
            
            keys.forEach(city => {
                if (city.toLowerCase().includes(filter.toLowerCase())) {
                    let li = document.createElement("li");
                    li.className = "hover-target";
                    li.innerText = city;
                    li.onclick = () => loadCityDetails(city);
                    cityListElement.appendChild(li);
                }
            });
        }

        // ARAMA FİLTRESİ
        function filterCities() {
            let val = document.getElementById('citySearch').value;
            renderList(val);
        }

        // ŞEHİR DETAYLARINI GÖSTERME
        function loadCityDetails(cityName) {
            let data = cityDatabase[cityName];
            document.getElementById('d-name').innerText = cityName;
            document.getElementById('d-region').innerText = data.region;
            document.getElementById('d-plate').innerText = data.plate;
            document.getElementById('d-pop').innerText = data.pop;
            document.getElementById('d-history').innerText = data.history;
            document.getElementById('d-food').innerText = data.food;
            document.getElementById('d-events').innerText = data.events;

            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('detailsContainer').style.display = 'flex';
        }

        // ARAMA PANELİNE GERİ DÖN
        function showSearchPanel() {
            document.getElementById('detailsContainer').style.display = 'none';
            document.getElementById('searchContainer').style.display = 'flex';
            document.getElementById('citySearch').value = '';
            renderList();
        }

        // YÜKLEME EKRANI
        window.addEventListener('load', () => {
            renderList();
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 1000);
            }, 1800);
        });

        // ÖZEL İMLEÇ
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);
        });

        // MAVİ-BEYAZ PARTİKÜLLER
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        let particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({ 
                x: Math.random() * canvas.width, 
                y: Math.random() * canvas.height, 
                s: Math.random() * 2 + 1, 
                sy: Math.random() * 1.5 + 0.5,
                opacity: Math.random() * 0.5 + 0.2
            });
        }
        
        function anim() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.y -= p.sy; 
                if (p.y < 0) { 
                    p.y = canvas.height; 
                    p.x = Math.random() * canvas.width; 
                }

                // Rastgele Mavi ve Beyaz tonlar
                ctx.fillStyle = Math.random() > 0.4 ? `rgba(116, 172, 223, ${p.opacity})` : `rgba(255, 255, 255, ${p.opacity})`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = "rgba(116, 172, 223, 0.8)";
                
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); 
                ctx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
